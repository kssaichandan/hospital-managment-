{% extends "base.html" %}
{% block content %}
<h1>Update Doctor #{{ doctor.id }}</h1>

<form method="post" class="form-col" id="edit-doctor-form" novalidate>
  <label for="doctor-name">Doctor name</label>
  <input id="doctor-name" name="name" value="{{ doctor.name }}">
  <label for="doctor-specialization">Specialization</label>
  <input id="doctor-specialization" name="specialization" value="{{ doctor.specialization }}">
  <label for="doctor-phone">Phone</label>
  <input id="doctor-phone" name="phone" value="{{ doctor.phone }}">
  <label for="doctor-fee">Consultation fee (Rs)</label>
  <input id="doctor-fee" name="fee" type="number" step="0.01" value="{{ doctor.fee }}">
  <div class="buttons">
    <button id="update-doctor-btn" type="submit">Update Doctor</button>
    <a class="link" href="{{ url_for('doctors') }}">Cancel</a>
  </div>
</form>
{% endblock %}
